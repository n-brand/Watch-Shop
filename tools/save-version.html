<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orvane – Version speichern</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
  <style>
    body { margin: 0; display: grid; grid-template-columns: 1fr 22rem; min-height: 100vh; background: #0b0a09; color: #ece6dc; font: 300 0.9rem/1.5 system-ui, sans-serif; }
    #stage { position: relative; min-height: 70vh; background: radial-gradient(ellipse at 50% 45%, #2a2219, #0b0a09 70%); }
    #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    aside { padding: 1.5rem; border-left: 1px solid rgb(236 230 220 / 0.12); display: flex; flex-direction: column; gap: 1rem; }
    h1 { font-weight: 400; margin: 0; }
    p { color: #9c9488; margin: 0; }
    label { display: grid; gap: 0.35rem; font-size: 0.8rem; color: #9c9488; }
    select, textarea, button { font: inherit; padding: 0.55rem 0.7rem; background: #15130f; color: #ece6dc; border: 1px solid rgb(236 230 220 / 0.2); }
    textarea { min-height: 6rem; resize: vertical; }
    button { cursor: pointer; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #status { min-height: 1.5em; }
    @media (max-width: 760px) { body { grid-template-columns: 1fr; } aside { border-left: 0; } }
  </style>
</head>
<body>
  <div id="stage"></div>
  <aside>
    <h1>Version speichern</h1>
    <p>Baut die Uhr aus Code und speichert sie als nächste Version im Verlauf (glb + Vorschaubild). Nur lokal mit <code>node server.js</code>.</p>
    <label>Modell
      <select id="model"></select>
    </label>
    <label>Beschreibung der Änderung
      <textarea id="note" placeholder="Was ist neu an dieser Version?"></textarea>
    </label>
    <button type="button" id="save" disabled>Als neue Version speichern</button>
    <p id="status" role="status"></p>
  </aside>
  <script type="module" src="save-version.js"></script>
</body>
</html>
